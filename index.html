<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DGT English Trainer</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f1f5f9);--fg:var(--tg-theme-text-color,#17263b);--card:var(--tg-theme-secondary-bg-color,#fff);--accent:var(--tg-theme-button-color,#2563eb)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}main{max-width:660px;margin:auto;padding:24px 16px 40px}header{font-weight:800;letter-spacing:.08em;font-size:13px;margin-bottom:24px}section{background:var(--card);border:1px solid #94a3b544;border-radius:20px;padding:20px;margin:12px 0}h1{font-size:32px;margin:8px 0}h2{font-size:21px}small,p{line-height:1.55}button{font:inherit;border:1px solid #94a3b566;border-radius:12px;padding:14px;color:inherit;background:transparent;cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:var(--tg-theme-button-text-color,#fff);border:0;width:100%;font-weight:700}.option{display:block;width:100%;text-align:left;margin:10px 0}.selected{outline:2px solid var(--accent)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.grid button{padding:8px}.answered{background:#2563eb22}progress{width:100%;accent-color:var(--accent)}img{width:100%;max-height:280px;object-fit:contain;border-radius:12px}a{color:var(--accent)}.muted{opacity:.75}.error{color:#dc2626}.good{color:#15803d}input{max-width:100%}</style><main><header>DGT / ENGLISH TRAINER</header><div id="app">Loading…</div></main><script type="module" src="./app.js"></script></html>
